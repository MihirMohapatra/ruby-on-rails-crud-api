<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products CRUD</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Product manager">
        <header class="topbar">
          <div>
            <p class="eyebrow">Rails + PostgreSQL</p>
            <h1>Products</h1>
          </div>
          <button class="secondary-button compact-button" id="refreshButton" type="button">Refresh</button>
        </header>

        <section class="editor-panel" aria-label="Product form">
          <form id="productForm">
            <input type="hidden" id="productId">

            <div class="field-grid">
              <label>
                <span>Name</span>
                <input id="name" name="name" type="text" maxlength="120" required placeholder="Notebook">
              </label>

              <label>
                <span>Price</span>
                <input id="price" name="price" type="number" min="0" step="0.01" required placeholder="5.99">
              </label>

              <label>
                <span>Quantity</span>
                <input id="quantity" name="quantity" type="number" min="0" step="1" required placeholder="25">
              </label>
            </div>

            <label>
              <span>Description</span>
              <textarea id="description" name="description" rows="3" placeholder="A short product note"></textarea>
            </label>

            <div class="form-actions">
              <button class="primary-button" type="submit" id="submitButton">Add product</button>
              <button class="secondary-button" type="button" id="cancelButton" hidden>Cancel edit</button>
            </div>
          </form>
        </section>

        <section class="status-row" aria-live="polite">
          <p id="statusMessage">Loading products...</p>
        </section>

        <section class="products-section" aria-label="Products list">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Description</th>
                  <th>Price</th>
                  <th>Qty</th>
                  <th aria-label="Actions"></th>
                </tr>
              </thead>
              <tbody id="productsBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState" hidden>
            <h2>No products yet</h2>
            <p>Add your first product with the form above.</p>
          </div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
